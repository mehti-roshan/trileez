name: trivix

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mongodb:
    image: ${MONGO_IMAGE:-mongo:8.0-noble}
    restart: unless-stopped
    init: true
    command: ["mongod", "--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' mongodb://localhost:27017/admin | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m
    stop_grace_period: 30s
    logging: *default-logging

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    init: true
    command:
      - mini
      - -dir=/data
      - -admin.port=22646
      - -master.volumeSizeLimitMB=${SEAWEEDFS_VOLUME_SIZE_MB:-1024}
      - -volume.max=${SEAWEEDFS_MAX_VOLUMES:-0}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    expose:
      - "8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 256m
    stop_grace_period: 30s
    logging: *default-logging

  server:
    image: ${SERVER_IMAGE:-trivix-server:local}
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      SERVICE_NAME: trivix-panel-api
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 4000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-25000}
      DEPENDENCY_TIMEOUT_MS: ${DEPENDENCY_TIMEOUT_MS:-5000}
      STARTUP_MAX_ATTEMPTS: ${STARTUP_MAX_ATTEMPTS:-10}
      STARTUP_RETRY_BASE_MS: ${STARTUP_RETRY_BASE_MS:-500}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PROJECT_ACCESS_ENCRYPTION_KEY: ${PROJECT_ACCESS_ENCRYPTION_KEY:?PROJECT_ACCESS_ENCRYPTION_KEY is required}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      ACCOUNT_LOCK_MINUTES: ${ACCOUNT_LOCK_MINUTES:-15}
      PASSWORD_RESET_MAX_REQUESTS: ${PASSWORD_RESET_MAX_REQUESTS:-3}
      PASSWORD_RESET_WINDOW_MINUTES: ${PASSWORD_RESET_WINDOW_MINUTES:-60}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
      USE_MOCK_DB: "false"
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-20}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: seaweedfs
      S3_PORT: 8333
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      ORGANIZATION_STORAGE_QUOTA_BYTES: ${ORGANIZATION_STORAGE_QUOTA_BYTES:-1073741824}
      UPLOAD_ORPHAN_GRACE_MINUTES: ${UPLOAD_ORPHAN_GRACE_MINUTES:-60}
      AUTO_SEED: "false"
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-2000}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-120}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-30}
      EMAIL_DELIVERY_WEBHOOK_URL: ${EMAIL_DELIVERY_WEBHOOK_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
      NODE_OPTIONS: --enable-source-maps
    expose:
      - "4000"
    depends_on:
      mongodb:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    stop_grace_period: 35s
    logging: *default-logging

  seed:
    extends:
      service: server
    profiles: ["tools"]
    restart: "no"
    command: ["node", "dist/seed.js"]
    environment:
      AUTO_SEED: "false"
      JOBS_ENABLED: "false"
      EMAIL_FROM: ${SEED_EMAIL_FROM:-seed@trivix.ir}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

  web:
    image: ${WEB_IMAGE:-trivix-web:local}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    logging: *default-logging

volumes:
  mongo-data:
  seaweedfs-data:
    name: trivix-seaweedfs-data

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  DOTNET_VERSION: "8.0.x"
  DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT: "false"

jobs:
  server:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: Panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npx --yes tsx --test tests/*.test.ts

  agent:
    name: Desktop agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: apps/agent/**/*.csproj
      - name: Restore and test Linux agent
        run: |
          chmod +x scripts/linux/dev.sh
          ./scripts/linux/dev.sh all

  publish:
    name: Publish images
    needs: [server, web, agent]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      image_prefix: ${{ steps.meta.outputs.prefix }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          prefix="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/server:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}/server:latest
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
          provenance: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build and push panel
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/web:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}/web:latest
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
            VITE_API_BASE_URL=/api
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy VPS
    needs: publish
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require VPS secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "$name is not set in GitHub Actions secrets."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Add the VPS secrets listed in docs/cicd.md, then re-run this workflow."
            exit 1
          fi
      - name: Resolve SSH port
        id: ssh
        env:
          VAR_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          VAR_PORT: ${{ vars.VPS_PORT }}
          SECRET_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          SECRET_PORT: ${{ secrets.VPS_PORT }}
        run: |
          port="${VAR_SSH_PORT:-${VAR_PORT:-${SECRET_SSH_PORT:-${SECRET_PORT:-22}}}}"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "Using SSH port $port"
      - name: Install deploy key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
      - name: Copy compose files
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
          DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_opts[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_DIR/deploy'"
          scp "${ssh_opts[@]}" -P "$SSH_PORT" compose.yaml "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/compose.yaml"
          scp "${ssh_opts[@]}" -P "$SSH_PORT" deploy/vps.sh "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/deploy/vps.sh"
      - name: Pull images and recreate panel
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ steps.ssh.outputs.port }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ needs.publish.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          {
            echo "set -euo pipefail"
            echo "export GHCR_USER=$(printf '%q' "$GHCR_USER")"
            echo "export GHCR_TOKEN=$(printf '%q' "$GHCR_TOKEN")"
            echo "export IMAGE_PREFIX=$(printf '%q' "$IMAGE_PREFIX")"
            echo "export IMAGE_TAG=$(printf '%q' "$IMAGE_TAG")"
            echo "export DEPLOY_DIR=$(printf '%q' "$DEPLOY_DIR")"
            echo 'chmod +x "$DEPLOY_DIR/deploy/vps.sh"'
            echo '"$DEPLOY_DIR/deploy/vps.sh"'
          } | ssh "${ssh_opts[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s

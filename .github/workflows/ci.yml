name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  DOTNET_VERSION: "8.0.x"
  DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2SUPPORT: "false"

jobs:
  server:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: Panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npx --yes tsx --test tests/*.test.ts

  agent:
    name: Desktop agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: apps/agent/**/*.csproj
      - name: Restore and test Linux agent
        run: |
          chmod +x scripts/linux/dev.sh
          ./scripts/linux/dev.sh all

  deploy:
    name: Deploy VPS
    needs: [server, web, agent]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: production-vps
      cancel-in-progress: false
    steps:
      - name: Require VPS secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "$name is not set in GitHub Actions secrets."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Add VPS_HOST, VPS_USER, and VPS_SSH_KEY, then re-run."
            exit 1
          fi
      - name: Resolve SSH port
        id: ssh
        env:
          VAR_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          VAR_PORT: ${{ vars.VPS_PORT }}
          SECRET_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          SECRET_PORT: ${{ secrets.VPS_PORT }}
        run: |
          port="${VAR_SSH_PORT:-${VAR_PORT:-${SECRET_SSH_PORT:-${SECRET_PORT:-22}}}}"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "Using SSH port $port"
      - name: Clone or sync trileez and compose up
        uses: appleboy/ssh-action@v1.2.2
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.ssh.outputs.port }}
          protocol: tcp4
          timeout: 60s
          command_timeout: 25m
          request_pty: true
          envs: EXPECTED_SHA,REPO,GIT_TOKEN
          script: |
            set -eu
            cd
            git_auth() {
              if [ -n "${GIT_TOKEN:-}" ]; then
                git -c http.extraHeader="AUTHORIZATION: bearer ${GIT_TOKEN}" "$@"
              else
                git "$@"
              fi
            }
            if [ ! -d trileez ]; then
              git_auth clone "https://github.com/${REPO}.git" trileez
            fi
            cd trileez
            git_auth fetch origin
            git reset --hard "$EXPECTED_SHA"
            docker compose --env-file .env up -d --build
            docker compose --env-file .env ps
